server:
  port: 8082

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719
  # 关键：导入Nacos配置，替代旧版bootstrap.yml
  config:
    import:
      - nacos:${spring.application.name}-dev.${spring.cloud.nacos.config.file-extension}?refreshEnabled=true
      # 本地开发配置(含数据库/RabbitMQ密码, 该文件已被 .gitignore 忽略); 可选导入, 不依赖启动工作目录
      - optional:classpath:application-local.yaml

  # 数据源配置(下单要写 t_order / t_order_item)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/spark_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # Redis: 订单"待支付 30 分钟超时"计时键用(配合定时任务兜底)
  data:
    redis:
      host: localhost
      port: 6379

# 订单业务自定义配置
app:
  order:
    expire-minutes: 30   # 待支付订单超时时间(分钟), 超时自动释放锁定的库存

# MyBatis-Plus 配置(与 product-service 保持一致)
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


# ============ Seata 分布式事务(AT 模式) ============
seata:
  enabled: true
  application-id: order-service
  tx-service-group: spark_mall_tx_group   # 事务分组, 全局事务发起方与参与方必须一致
  # 注册中心: 用 Nacos 发现 Seata Server
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
  # 配置中心(事务分组与集群映射; 此处用 file 模式本地解析, 简单可靠)
  config:
    type: file
    file:
      name: file.conf   # 需放入 resources, 或直接用下方 service 行内映射
  # 事务分组 -> 集群 映射(等价 file.conf 里的 service.vgroupMapping)
  service:
    vgroup-mapping:
      spark_mall_tx_group: default
    grouplist:
      default: localhost:8091

